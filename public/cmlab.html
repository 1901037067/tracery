<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM6 探针 · cmlab — 编辑区内核迁移 P0</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #d9dce3; --text: #1f2329;
    --muted: #6b7280; --ok: #15803d; --ok-bg: #ecfdf3; --bad: #b42318; --bad-bg: #fef3f2;
    --accent: #7c3aed; --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header { padding: 14px 20px 10px; }
  header h1 { font-size: 17px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .wrap { padding: 0 20px 24px; display: grid; gap: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: inherit; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  .hint { color: var(--muted); font-size: 12px; }
  #cm {
    height: 520px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); overflow: hidden; font-size: 14px;
  }
  #cm .cm-editor { height: 100%; }
  #cm .cm-scroller { font-family: var(--mono); line-height: 1.65; }
  /* 实时预览装饰（public/js/cm/decorations.js 生成，P1）——与 Obsidian 同款：
     光标行显示原始语法，离开即隐藏（hide 装饰）；列表标记常显但 muted */
  .cm-lp-h1 { font-size: 1.5em; font-weight: 700; }
  .cm-lp-h2 { font-size: 1.25em; font-weight: 650; }
  .cm-lp-h3 { font-size: 1.12em; font-weight: 600; }
  .cm-lp-h4, .cm-lp-h5, .cm-lp-h6 { font-size: 1em; font-weight: 600; }
  .cm-lp-bold { font-weight: 700; }
  .cm-lp-em { font-style: italic; }
  .cm-lp-del { text-decoration: line-through; }
  .cm-lp-mark { background: #fde68a; border-radius: 2px; }
  .cm-lp-code { font-family: var(--mono); background: #f3f4f6; border-radius: 3px; padding: 0 3px; }
  .cm-lp-wikilink { color: #7c3aed; text-decoration: underline dotted; cursor: pointer; }
  .cm-lp-embed { color: #7c3aed; background: #faf5ff; border-radius: 3px; padding: 0 3px; }
  .cm-lp-tag { color: #6d28d9; background: #f5f3ff; border-radius: 3px; padding: 0 3px; }
  .cm-lp-marker { color: #9ca3af; }
  .cm-lp-fence { color: #9ca3af; }
  .cm-lp-hr { border-top: 1px solid var(--border); }
  .cm-lp-tr { background: #fafafa; }
  .cm-lp-tr-head { background: #f3f4f6; font-weight: 600; }
  .cm-lp-zero { height: 0; overflow: hidden; }
  .probe-collapse, .probe-grow {
    border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 6px; padding: 8px 12px; margin: 4px 0; background: #faf5ff;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .probe-collapse .spacer, .probe-grow .spacer { transition: height .12s; background: #ede9fe; border-radius: 4px; }
  .probe-collapse button, .probe-grow button { margin-bottom: 6px; }
  #results { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  #results h2 { font-size: 13px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); background: #fafafa; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 14px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.mono { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.wait { background: #fef9c3; color: #a16207; }
  #overall { font-weight: 600; }
</style>

{
  "imports": {
    "@codemirror/state": "/vendor/cm/@codemirror/state/index.js",
    "@codemirror/view": "/vendor/cm/@codemirror/view/index.js",
    "@codemirror/commands": "/vendor/cm/@codemirror/commands/index.js",

    "@marijn/find-cluster-break": "/vendor/cm/@marijn/find-cluster-break/index.js",
    "crelt": "/vendor/cm/crelt/index.js",
    "style-mod": "/vendor/cm/style-mod/index.js",
    "w3c-keyname": "/vendor/cm/w3c-keyname/index.js",
    "@codemirror/language": "/vendor/cm/@codemirror/language/index.js",
    "@lezer/common": "/vendor/cm/@lezer/common/index.js",
    "@codemirror/autocomplete": "/vendor/cm/@codemirror/autocomplete/index.js",
    "@codemirror/lang-html": "/vendor/cm/@codemirror/lang-html/index.js",
    "@lezer/highlight": "/vendor/cm/@lezer/highlight/index.js",
    "@codemirror/streamparser": "/vendor/cm/@codemirror/streamparser/index.js",
    "@lezer/lr": "/vendor/cm/@lezer/lr/index.js",
    "@codemirror/lang-css": "/vendor/cm/@codemirror/lang-css/index.js",
    "@codemirror/lang-javascript": "/vendor/cm/@codemirror/lang-javascript/index.js",
    "@lezer/html": "/vendor/cm/@lezer/html/index.js",
    "@lezer/css": "/vendor/cm/@lezer/css/index.js",

</head>
<body>
<header>
  <h1>CM6 探针 · cmlab</h1>
  <p>编辑区内核迁移 P0：独立验证中文输入法组词 / 行号 / 3000 行滚动 / Decoration.widget 高度变化滚动稳定性 / history 撤销选区恢复。本页不依赖现有编辑区代码。</p>
</header>
<div class="wrap">
  <div class="bar">
    <button class="primary" id="btn-run">运行全部探针</button>
    <button id="btn-doc3000">重载 3000 行</button>
    <button id="btn-doc1000">重载 1000 行</button>
    <button id="btn-undo">undo</button>
    <button id="btn-redo">redo</button>
    <span class="hint" id="ime-hint">IME 组词探针需由 <code>npm run test:cmlab</code> 经 CDP 驱动（页内手动组词也可观察）</span>
    <span class="hint" id="overall"></span>
  </div>
  <div id="cm"></div>
  <div id="results">
    <h2>探针结果 <span id="results-status" class="tag wait">未运行</span></h2>
    <table>
      <thead><tr><th style="width:130px">探针</th><th style="width:64px">结论</th><th>测量数据</th></tr></thead>
      <tbody id="results-body">
        <tr><td colspan="3" class="hint">点击「运行全部探针」开始。</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script type="module" src="/js/cmlab.js"></script>
</body>
</html>
